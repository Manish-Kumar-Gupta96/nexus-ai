<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Sign In | NexusAI Cloud Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at 50% 50%, #0f172a 0%, #05070b 100%);">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card glass-panel border-0 p-4 p-md-5 shadow-lg text-center">
                    <div class="d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 50px; height: 50px; background: linear-gradient(135deg, #6366f1, #d946ef); border-radius: 12px; font-size: 24px; box-shadow: 0 0 20px rgba(217, 70, 239, 0.5);">
                        <i class="fa-solid fa-brain text-white"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1 brand-font">NexusAI Cloud Console</h3>
                    <p class="text-white-50 small mb-4">Sign in to manage API keys, billing, and neural models.</p>

                    <form onsubmit="event.preventDefault(); window.location.href='app.html';">
                        <div class="mb-3 text-start">
                            <label class="small text-white-50 fw-semibold mb-1">Developer Email</label>
                            <input type="email" class="form-control bg-dark text-white border-secondary rounded-3" value="developer@nexus-ai.dev" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="small text-white-50 fw-semibold mb-1">Password</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary rounded-3" value="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-nexus-primary w-100 py-3 rounded-pill fw-bold mb-3">
                            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Launch Studio Dashboard
                        </button>
                    </form>

                    <div class="pt-3 border-top border-secondary border-opacity-25">
                        <a href="app.html" class="btn btn-nexus-secondary btn-sm w-100 rounded-pill py-2">
                            <i class="fa-solid fa-bolt me-1 text-warning"></i> Instant 1-Click Guest Developer Access
                        </a>
                    </div>
                </div>

                <div class="text-center mt-3 text-white-50 small">
                    <a href="index.html" class="text-white-50 text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
